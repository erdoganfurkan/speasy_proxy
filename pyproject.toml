[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "speasy-proxy"
version = "0.15.1"
description = "A fast Speasy cache server."
keywords = ["satellite", "plasma-physics", "nasa-data", "amda", "cdpp", "CDF"]
authors = [
    { name = "Alexis Jeandet", email = "alexis.jeandet@member.fsf.org" }
]
maintainers = [
    { name = "Alexis Jeandet", email = "alexis.jeandet@member.fsf.org" }
]
requires-python = ">=3.10"
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "humanize",
    # The AMDA_Kernel chain needs the forks, not the PyPI releases:
    #   speasy: master file applied at decode time, local archives with gaps, .gz archives
    #   pyistp: netCDF3 routed to the right driver, DDBASE time formats decoded from the master
    # Branches on purpose -- this is a moving integration. Pin to a tag or a commit before
    # anything ships. See docs/amda-kernel.md.
    "speasy @ git+https://github.com/erdoganfurkan/speasy.git@feat/direct-archive-master-file-and-gzip",
    "pyistp @ git+https://github.com/erdoganfurkan/PyISTP.git@feat/ddbase-netcdf-master",
    "pycdfpp>=0.7.3",
    "diskcache",
    "jinja2",
    "pyzstd",
    "bokeh>=3.0.0",
    "matplotlib",
    "fastapi[all]",
    "uvicorn",
    "uvicorn-worker",
    "pycrdt-websocket>=0.15.4,<0.16.0",
]

[project.optional-dependencies]
fast = [
    "numba",
]
dev = [
    "pytest",
    "ddt",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "isort",
    "mypy",
    "flake8",
]

[project.urls]
homepage = "https://github.com/SciQLop/speasy_proxy"

[tool.hatch.metadata]
# Required by the git pins above; hatchling refuses direct references otherwise.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["speasy_proxy"]

[tool.pytest.ini_options]
testpaths = ["speasy_proxy"]
python_files = ["test*.py"]

[tool.coverage.run]
source = ["speasy_proxy"]
omit = ["speasy_proxy/test*"]

[tool.bumpversion]
current_version = "0.15.1"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "speasy_proxy/__init__.py"
search = "__version__ = '{current_version}'"
replace = "__version__ = '{new_version}'"

[[tool.bumpversion.files]]
filename = "VERSION"
